name: Snoo Box

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: snoo-box
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.CLONE_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: actions/checkout@v7 - Check Out Source
        uses: actions/checkout@v7
        with:
          repository: ParkSnoopy/snoo-box
          path: source
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - name: bash - Resolve Source Revision
        id: source
        run: |
          set -euo pipefail
          revision="$(git -C source rev-parse HEAD)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          version="$(sed -n 's/^const AppVersion = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' source/app/src/internal/core/buildinfo/version.go)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if ! grep -Fq 'verify:prebuilt:' source/engines/Taskfile.yml; then
            echo 'The source revision lacks shared Linux payload support; publish the snoo-box build-graph fix before dispatching this workflow.' >&2
            exit 1
          fi
          if ! grep -Fq 'verify:overlay-hub:' source/app/build/Taskfile.yml; then
            echo 'The source revision lacks shared overlay hub support; publish the snoo-box build-graph fix before dispatching this workflow.' >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux-engines:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: actions/checkout@v7 - Check Out Pinned Source
        uses: actions/checkout@v7
        with:
          repository: ParkSnoopy/snoo-box
          ref: ${{ needs.prepare.outputs.revision }}
          path: source
          submodules: recursive
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - &restore-engine-tags
        name: bash - Restore Engine Release Tags
        shell: bash
        run: |
          set -euo pipefail
          for engine in xray-core hysteria; do
            directory="source/protocols/$engine"
            if [[ "$(git -C "$directory" rev-parse --is-shallow-repository)" == true ]]; then
              git -C "$directory" fetch --unshallow --tags
            else
              git -C "$directory" fetch --tags
            fi
          done
      - &setup-go
        name: actions/setup-go@v7 - Set Up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: bash - Install Linux Engine Toolchains
        run: |
          set -euo pipefail
          sudo apt-get update -o Dir::Etc::sourcelist='sources.list.d/ubuntu.sources' -o Dir::Etc::sourceparts='-' -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - &install-wails
        name: bash - Install Wails CLI from Application Module
        working-directory: source/app
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$(mktemp -d)"
          trap 'rm -r "$tools_dir"' EXIT
          cp go.mod go.sum "$tools_dir/"
          # Keep local replacements rooted in the app; isolate CLI-only edits.
          GOBIN="$(go env GOPATH)/bin" go install -mod=mod -modfile="$tools_dir/go.mod" github.com/wailsapp/wails/v3/cmd/wails3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: bash - Build Linux Engines
        working-directory: source/app
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          wails3 task native:verify
          mkdir -p bin/engines/linux-amd64
          for task in xray hysteria; do
            wails3 task "native:$task" TARGET_OS=linux TARGET_ARCH=amd64
            test -x "bin/engines/linux-amd64/$task"
          done
      - name: bash - Build and Record Linux Payloads
        working-directory: source/app
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          wails3 task common:build:overlay-hub
          test -f bin/overlay-hub && test -s bin/overlay-hub && test -x bin/overlay-hub && ! test -L bin/overlay-hub
          git rev-parse HEAD > bin/engines/linux-amd64.revision
          cd bin
          engines=(engines/linux-amd64/{xray,hysteria})
          sha256sum --binary "${engines[@]}" > engines/linux-amd64.sha256
          sha256sum --binary overlay-hub > overlay-hub.sha256
          (cd .. && wails3 task common:verify:overlay-hub)
          tar -czf linux-engines.tar.gz "${engines[@]}" engines/linux-amd64.sha256 engines/linux-amd64.revision overlay-hub overlay-hub.sha256
      - name: actions/upload-artifact@v7 - Upload Linux Engine Payloads
        uses: actions/upload-artifact@v7
        with:
          name: snoo-box-linux-engines
          path: source/app/bin/linux-engines.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [prepare, linux-engines]
    environment: snoo-box
    env:
      SNOO_PREBUILT_LINUX_ENGINES: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, os: ubuntu-latest}
          - {platform: android, os: ubuntu-latest}
          - {platform: windows, os: windows-latest}
          - {platform: macos, os: macos-latest}
          - {platform: ios, os: macos-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - name: actions/checkout@v7 - Check Out Pinned Source
        uses: actions/checkout@v7
        with:
          repository: ParkSnoopy/snoo-box
          ref: ${{ needs.prepare.outputs.revision }}
          path: source
          submodules: recursive
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - *restore-engine-tags
      - *setup-go
      - name: oven-sh/setup-bun@v2 - Set Up Bun
        uses: oven-sh/setup-bun@v2
      - name: actions/download-artifact@v8 - Download Linux Engine Payloads
        uses: actions/download-artifact@v8
        with:
          name: snoo-box-linux-engines
          path: payload
          github-token: ${{ env.GH_TOKEN }}
      - name: bash - Restore Verified Linux Payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/app/bin
          tar -xzf payload/linux-engines.tar.gz -C source/app/bin
      - name: bash - Install Linux Dependencies
        if: matrix.platform == 'linux' || matrix.platform == 'android'
        run: |
          set -euo pipefail
          sudo apt-get update -o Dir::Etc::sourcelist='sources.list.d/ubuntu.sources' -o Dir::Etc::sourceparts='-' -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: actions/setup-java@v6 - Set Up Java
        uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          # AGP 8.7.3's bundled lint rejects JDK 25; select the newest compatible GA release.
          java-version: '>=17 <25'
          check-latest: true
      - name: android-actions/setup-android@v4 - Set Up Android SDK
        uses: android-actions/setup-android@v4
        if: matrix.platform == 'android'
        with:
          packages: ''
      - name: bash - Install Android SDK and Signing Key
        if: matrix.platform == 'android'
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEY:?Set ANDROID_KEYSTORE_BASE64 for snoo-box}"
          : "${STORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD for snoo-box}"
          : "${KEY_ALIAS:?Set ANDROID_KEY_ALIAS for snoo-box}"
          : "${KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD for snoo-box}"
          available="$(sdkmanager --list --channel=0)"
          ndk="$(printf '%s\n' "$available" | python3 -c 'import re,sys; versions=set(re.findall(r"^\s*ndk;([0-9]+(?:\.[0-9]+)+)\s*\|",sys.stdin.read(),re.M)); print(max(versions,key=lambda v:tuple(map(int,v.split(".")))))')"
          tools="$(printf '%s\n' "$available" | python3 -c 'import re,sys; versions=set(re.findall(r"^\s*build-tools;([0-9]+(?:\.[0-9]+)+)\s*\|",sys.stdin.read(),re.M)); print(max(versions,key=lambda v:tuple(map(int,v.split(".")))))')"
          sdkmanager "ndk;$ndk" 'platforms;android-35' "build-tools;$tools"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk"
            echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/$tools"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/snoo-box.jks"
          keytool -list -keystore "$RUNNER_TEMP/snoo-box.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/snoo-box.jks" >> "$GITHUB_ENV"
      - name: pwsh - Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed with exit code $LASTEXITCODE" }
          $nsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (!(Test-Path -LiteralPath (Join-Path $nsisDirectory 'makensis.exe') -PathType Leaf)) {
            throw "NSIS compiler not found in $nsisDirectory"
          }
          $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: bash - Expose Git Utilities to Native Windows Tasks
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # Wails/Task resolves external commands with Windows PATH, not Bash's /usr/bin.
          test -f /usr/bin/sha256sum.exe
          test -f /usr/bin/cmp.exe
          cygpath -w /usr/bin >> "$GITHUB_PATH"
      - name: pwsh - Verify Native Windows Utility Lookup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in @('sha256sum.exe', 'cmp.exe')) {
            $command = Get-Command $tool -CommandType Application -ErrorAction Stop
            & $command.Source --version
            if ($LASTEXITCODE -ne 0) { throw "$tool failed with exit code $LASTEXITCODE" }
          }
          $nsis = Get-Command makensis.exe -CommandType Application -ErrorAction Stop
          & $nsis.Source /VERSION
          if ($LASTEXITCODE -ne 0) { throw "NSIS compiler failed with exit code $LASTEXITCODE" }
      - *install-wails
      - name: bash - Verify Imported Engine Payloads
        working-directory: source/app
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            macos) namespace=darwin ;;
            linux|android|windows|ios) namespace="$PLATFORM" ;;
            *) exit 1 ;;
          esac
          # Exercise the same nested include used by frontend/binding builds.
          wails3 task "$namespace:common:verify:overlay-hub"
      - name: bash - Package Application
        working-directory: source/app
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            linux)
              # Build only the portable bundle, not DEB/RPM/Arch packages.
              wails3 task linux:create:bundle
              wails3 task cli:package
              ;;
            android) wails3 task android:package ARCH=arm64 ;;
            windows) wails3 task windows:package ARCH=amd64 ;;
            macos) wails3 task darwin:package ARCH=arm64 ;;
            ios) wails3 task ios:package IOS_PLATFORM=simulator ;;
            *) exit 1 ;;
          esac
      - name: bash - Stage Release Packages
        working-directory: source/app
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          prefix="Snoo_Box_v$VERSION"
          mkdir -p dist
          case "$PLATFORM" in
            linux)
              test -s bin/snoo-box-linux-amd64.tar.gz
              tar -tzf bin/snoo-box-linux-amd64.tar.gz | grep -x 'snoo-box-linux-amd64/snoo-box' > /dev/null
              test -s bin/snoo-box-cli-linux-amd64.zip
              cp bin/snoo-box-linux-amd64.tar.gz "dist/$prefix-amd64-Linux.tar.gz"
              cp bin/snoo-box-cli-linux-amd64.zip "dist/$prefix-amd64-Linux_CLI.zip"
              ;;
            android)
              test -s bin/snoo-box.apk
              "$ANDROID_BUILD_TOOLS/apksigner" verify --min-sdk-version 21 --verbose bin/snoo-box.apk
              cp bin/snoo-box.apk "dist/$prefix-arm64-Android.apk"
              ;;
            windows)
              test -s bin/snoo-box-amd64-installer.exe
              cp bin/snoo-box-amd64-installer.exe "dist/$prefix-amd64-Windows.exe"
              ;;
            macos)
              test -d bin/snoo-box.app
              ditto -c -k --sequesterRsrc --keepParent bin/snoo-box.app "dist/$prefix-arm64-macOS.zip"
              ;;
            ios)
              test -d bin/snoo-box.app
              ditto -c -k --sequesterRsrc --keepParent bin/snoo-box.app "dist/$prefix-arm64-iOS_Simulator.zip"
              ;;
            *) exit 1 ;;
          esac
      - name: actions/upload-artifact@v7 - Upload Release Packages
        uses: actions/upload-artifact@v7
        with:
          name: snoo-box-release-${{ matrix.platform }}
          path: source/app/dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: actions/checkout@v7 - Check Out Release Action
        uses: actions/checkout@v7
        with:
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - name: ./.github/actions/publish-release - Publish Release
        uses: ./.github/actions/publish-release
        with:
          repository: snoo-box
          title: Snoo Box
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.revision }}
          token: ${{ secrets.RELEASE_TOKEN }}
