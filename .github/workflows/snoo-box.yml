name: Snoo Box

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: snoo-box
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.CLONE_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: actions/checkout@v7 - Check Out Source
        uses: actions/checkout@v7
        with:
          repository: ParkSnoopy/snoo-box
          path: source
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - name: bash - Resolve Source Revision
        id: source
        run: |
          set -euo pipefail
          revision="$(git -C source rev-parse HEAD)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          version="$(sed -n 's/^const AppVersion = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' source/app/src/internal/core/buildinfo/version.go)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if ! grep -Fq 'verify:prebuilt:' source/engines/Taskfile.yml; then
            echo 'The source revision lacks shared Linux payload support; publish the snoo-box build-graph fix before dispatching this workflow.' >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux-engines:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      GO_CACHE_TARGET: linux-engines

      CCACHE_MAXSIZE: 1G
      # Downloaded Chromium compilers have fresh mtimes on each runner.
      CCACHE_COMPILERCHECK: content
    steps:
      - name: actions/checkout@v7 - Check Out Pinned Source
        uses: actions/checkout@v7
        with:
          repository: ParkSnoopy/snoo-box
          ref: ${{ needs.prepare.outputs.revision }}
          path: source
          submodules: recursive
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - &restore-engine-tags
        name: bash - Restore Engine Release Tags
        shell: bash
        run: |
          set -euo pipefail
          for engine in xray-core hysteria amneziawg-go; do
            directory="source/protocols/$engine"
            if [[ "$(git -C "$directory" rev-parse --is-shallow-repository)" == true ]]; then
              git -C "$directory" fetch --unshallow --tags
            else
              git -C "$directory" fetch --tags
            fi
          done
      - &setup-go
        name: actions/setup-go@v7 - Set Up Go
        uses: actions/setup-go@v7
        id: setup_go
        with:
          go-version: stable
          check-latest: true
          # Target-scoped caches avoid an immutable snapshot shared by the
          # producer and both Linux platform jobs.
          cache: false
      - &go-cache-paths
        name: bash - Resolve Go Cache Directories
        id: go_cache_paths
        shell: bash
        run: |
          set -euo pipefail
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - &restore-go-cache
        name: actions/cache@v6 - Restore Go Compiler and Module Cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go_cache_paths.outputs.build }}
            ${{ steps.go_cache_paths.outputs.modules }}
          key: snoo-box-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_CACHE_TARGET }}-${{ steps.setup_go.outputs.go-version }}-${{ hashFiles('source/**/go.mod', 'source/**/go.sum', 'source/**/go.work', 'source/**/go.work.sum') }}-${{ needs.prepare.outputs.revision }}
          # Prefix reuse is safe for Go's content-addressed compilation cache,
          # never for finished engine binaries. New source revisions save
          # refreshed compiler outputs instead of freezing the first snapshot.
          restore-keys: |
            snoo-box-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_CACHE_TARGET }}-${{ steps.setup_go.outputs.go-version }}-${{ hashFiles('source/**/go.mod', 'source/**/go.sum', 'source/**/go.work', 'source/**/go.work.sum') }}-
            snoo-box-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_CACHE_TARGET }}-${{ steps.setup_go.outputs.go-version }}-
      - name: actions/setup-python@v7 - Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - &restore-apt-downloads
        name: actions/cache@v6 - Restore Linux Package Downloads
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          # Cache archives only, not root-owned APT locks or partial downloads.
          # APT still resolves and verifies the current repository packages.
          path: ${{ runner.temp }}/snoo-box-apt-cache/*.deb
          key: snoo-box-apt-v1-${{ runner.arch }}-${{ steps.go_cache_paths.outputs.image }}-${{ env.GO_CACHE_TARGET }}-${{ needs.prepare.outputs.revision }}
          restore-keys: |
            snoo-box-apt-v1-${{ runner.arch }}-${{ steps.go_cache_paths.outputs.image }}-${{ env.GO_CACHE_TARGET }}-
      - name: bash - Install Linux Engine Toolchains
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/snoo-box-apt-cache"
          sudo apt-get update -o Dir::Etc::sourcelist='sources.list.d/ubuntu.sources' -o Dir::Etc::sourceparts='-' -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          # Let libc++ select its matching LLVM unwinder; libunwind-dev conflicts with it.
          # Added wails3 build depdendency into LLVM installation depdendency install procedure
          sudo apt-get install -y -o Dir::Cache::archives="$RUNNER_TEMP/snoo-box-apt-cache" -o APT::Keep-Downloaded-Packages=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 build-essential pkg-config clang clang-tools libc++-dev libc++abi-dev libgtk-4-dev libwebkitgtk-6.0-dev ccache
          python -m pip install --upgrade 'conan>=2,<3' cmake ninja PyYAML
          rustup update stable nightly
          conan --version
          cmake --version
          ninja --version
          clang --version
          ccache --version
          echo "CCACHE_DIR=$RUNNER_TEMP/snoo-box-naive-ccache" >> "$GITHUB_ENV"
      - &install-wails
        name: bash - Install Wails CLI from Application Module
        working-directory: source/app
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$(mktemp -d)"
          trap 'rm -r "$tools_dir"' EXIT
          cp go.mod go.sum "$tools_dir/"
          GOBIN="$(go env GOPATH)/bin" go -C "$tools_dir" install -mod=mod github.com/wailsapp/wails/v3/cmd/wails3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: bash - Resolve Linux Engine Cache Keys
        id: engine_inputs
        working-directory: source/app
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          wails3 task native:verify
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import yaml
          from pathlib import Path

          root = Path.cwd().parent
          def capture(*command):
              return subprocess.check_output(command, text=True).strip()

          def digest(relative):
              path = root / relative
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None

          # Only the matching engine's overlays enter its key. The shared recipe
          # and actual tool versions invalidate binaries when build policy changes.
          # App dependency churn does not change standalone engine binaries.
          # Retain the actual Wails/Task CLI build identity, not the whole app
          # module graph; the first metadata line contains only its install path.
          wails = Path(capture("go", "env", "GOPATH")) / "bin" / "wails3"
          recipe = {
              "engines/Taskfile.yml": digest("engines/Taskfile.yml"),
              "wails_cli": capture("go", "version", "-m", str(wails)).splitlines()[1:],
          }
          taskfile = yaml.safe_load((root / "engines/Taskfile.yml").read_text())
          def task_inputs(name):
              task = taskfile["tasks"][name]
              dependencies = [entry if isinstance(entry, str) else entry["task"]
                              for entry in task.get("deps", [])]
              dependencies += [entry["task"] for entry in task.get("cmds", [])
                               if isinstance(entry, dict) and "task" in entry]
              return {"definition": task, "dependencies": [task_inputs(name) for name in dependencies]}

          # Retain global Task settings and the complete NaiveProxy task closure,
          # not unrelated engine recipes. Chromium pins Clang/GN/PGO in its source;
          # the system Rust installation is not part of this C/C++ build.
          naive_recipe = {
              "globals": {key: value for key, value in taskfile.items() if key != "tasks"},
              "task": task_inputs("naiveproxy"),
              "wails_cli": recipe["wails_cli"],
          }
          tools = {
              "go": [capture("go", "version"), capture("go", "env", "GOAMD64", "GOEXPERIMENT", "GOFIPS140")],
              "cpp": [capture("clang", "--version"), capture("cmake", "--version"),
                      capture("ninja", "--version"), capture("conan", "--version"),
                      capture("dpkg-query", "-W", "-f=${binary:Package}=${Version}\\n",
                              "build-essential", "clang", "clang-tools", "libc++-dev", "libc++abi-dev")],
              "rust": [capture("rustc", "+nightly", "-Vv"), capture("cargo", "+nightly", "--version")],
              "chromium": [sys.version, capture("ninja", "--version"), capture("ccache", "--version"),
                           capture("dpkg-query", "-W", "-f=${binary:Package}=${Version}\\n",
                                   "build-essential", "libc6-dev")],
          }
          engines = (
              ("xray", "xray-core", "xray", "xray", "go", ("engines/xray-tls-certificates.patch",)),
              ("hysteria", "hysteria", "hysteria", "hysteria", "go", ()),
              ("amneziawg", "amneziawg-go", "amneziawg-go", "amneziawg-go", "go", ()),
              ("trusttunnel_client", "trusttunnel-client", "trusttunnel", "trusttunnel_client", "cpp", ()),
              ("trusttunnel_endpoint", "trusttunnel", "trusttunnel-endpoint", "trusttunnel_endpoint", "rust",
               ("engines/trusttunnel-camouflage.patch",)),
              ("naive", "naiveproxy", "naiveproxy", "naive", "chromium", ("engines/naiveproxy-static.patch",)),
              ("naiveproxy_server", "naiveproxy-server", "naiveproxy-server", "naiveproxy-server", "go",
               ("engines/naiveproxy-accounting.patch", "engines/naiveproxy-server/stats.go")),
          )
          plan = []
          for name, directory, task, binary, toolchain, overlays in engines:
              source = root / "protocols" / directory
              inputs = {
                  "schema": 1, "target": "linux/amd64", "engine": name,
                  "image": [os.environ["ImageOS"], os.environ["ImageVersion"]],
                  "source": capture("git", "-C", str(source), "rev-parse", "HEAD"),
                  "release": capture("git", "-C", str(source), "describe", "--tags", "--abbrev=0", "HEAD")
                             if name in ("xray", "hysteria", "amneziawg") else None,
                  "recipe": naive_recipe if name == "naive" else recipe, "toolchain": tools[toolchain],
                  "overlays": {path: digest(path) for path in overlays},
              }
              fingerprint = hashlib.sha256(json.dumps(inputs, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
              key = f"snoo-box-linux-amd64-v1-{name}-{fingerprint}"
              plan.append({"name": name, "task": task, "binary": binary, "key": key})
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for engine in plan:
                  print(f'{engine["name"]}={engine["key"]}', file=output)
              print("plan=" + json.dumps(plan, separators=(",", ":")), file=output)
          PY
      # Exact keys only: never restore binaries from a different input revision.
      # These directories contain one executable and its validation metadata,
      # never compiler intermediates, exported sources or test keys.
      - name: actions/cache@v6 - Cache Xray Binary
        uses: actions/cache@v6
        id: cache_xray
        with:
          path: ${{ runner.temp }}/snoo-box-engine-cache/xray
          key: ${{ steps.engine_inputs.outputs.xray }}
      - name: actions/cache@v6 - Cache Hysteria Binary
        uses: actions/cache@v6
        id: cache_hysteria
        with:
          path: ${{ runner.temp }}/snoo-box-engine-cache/hysteria
          key: ${{ steps.engine_inputs.outputs.hysteria }}
      - name: actions/cache@v6 - Cache AmneziaWG Binary
        uses: actions/cache@v6
        id: cache_amneziawg
        with:
          path: ${{ runner.temp }}/snoo-box-engine-cache/amneziawg
          key: ${{ steps.engine_inputs.outputs.amneziawg }}
      - name: actions/cache@v6 - Cache TrustTunnel Client Binary
        uses: actions/cache@v6
        id: cache_trusttunnel_client
        with:
          path: ${{ runner.temp }}/snoo-box-engine-cache/trusttunnel_client
          key: ${{ steps.engine_inputs.outputs.trusttunnel_client }}
      - name: actions/cache@v6 - Cache TrustTunnel Endpoint Binary
        uses: actions/cache@v6
        id: cache_trusttunnel_endpoint
        with:
          path: ${{ runner.temp }}/snoo-box-engine-cache/trusttunnel_endpoint
          key: ${{ steps.engine_inputs.outputs.trusttunnel_endpoint }}
      - name: actions/cache@v6 - Cache NaiveProxy Client Binary
        uses: actions/cache@v6
        id: cache_naive
        with:
          path: ${{ runner.temp }}/snoo-box-engine-cache/naive
          key: ${{ steps.engine_inputs.outputs.naive }}
      - name: actions/cache@v6 - Cache NaiveProxy Server Binary
        uses: actions/cache@v6
        id: cache_naiveproxy_server
        with:
          path: ${{ runner.temp }}/snoo-box-engine-cache/naiveproxy_server
          key: ${{ steps.engine_inputs.outputs.naiveproxy_server }}
      - name: actions/cache/restore@v6 - Restore NaiveProxy Compiler Cache
        # Compiler entries validate source, headers, flags and compiler contents.
        # Compatible prefix restores are safe here, unlike finished binaries.
        # A unique snapshot key avoids freezing the first partial compilation.
        # Keep this restore after the exact binary lookup to avoid needless I/O.
        uses: actions/cache/restore@v6
        id: naive_ccache
        if: steps.cache_naive.outputs.cache-hit != 'true'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: snoo-box-naive-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine_inputs.outputs.naive }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            snoo-box-naive-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine_inputs.outputs.naive }}-
            snoo-box-naive-ccache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: bash - Build or Reuse Linux Engines
        id: engine_build
        working-directory: source/app
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: stable
          ENGINE_PLAN: ${{ steps.engine_inputs.outputs.plan }}
          XRAY_CACHE_HIT: ${{ steps.cache_xray.outputs.cache-hit }}
          HYSTERIA_CACHE_HIT: ${{ steps.cache_hysteria.outputs.cache-hit }}
          AMNEZIAWG_CACHE_HIT: ${{ steps.cache_amneziawg.outputs.cache-hit }}
          TRUSTTUNNEL_CLIENT_CACHE_HIT: ${{ steps.cache_trusttunnel_client.outputs.cache-hit }}
          TRUSTTUNNEL_ENDPOINT_CACHE_HIT: ${{ steps.cache_trusttunnel_endpoint.outputs.cache-hit }}
          NAIVE_CACHE_HIT: ${{ steps.cache_naive.outputs.cache-hit }}
          NAIVEPROXY_SERVER_CACHE_HIT: ${{ steps.cache_naiveproxy_server.outputs.cache-hit }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          validate_cache() {
            local directory=$1 expected_key=$2 entry payload_file
            local -a entries
            test -d "$directory" && ! test -L "$directory" || return 1
            entries=("$directory"/*)
            test "${#entries[@]}" -eq 3 || return 1
            for entry in binary key binary.sha256; do
              payload_file="$directory/$entry"
              test -f "$payload_file" && test -s "$payload_file" && ! test -L "$payload_file" || return 1
            done
            test -x "$directory/binary" || return 1
            printf '%s\n' "$expected_key" | cmp - "$directory/key" || return 1
            (cd "$directory" && sha256sum --binary binary | cmp - binary.sha256)
          }
          specification=$(python3 -c 'import json,os; [print(e["name"],e["task"],e["binary"],e["key"]) for e in json.loads(os.environ["ENGINE_PLAN"])]')
          mkdir -p bin/engines/linux-amd64
          while read -r name task binary key; do
            cache_directory="$RUNNER_TEMP/snoo-box-engine-cache/$name"
            hit_variable="${name^^}_CACHE_HIT"
            case "${!hit_variable}" in
              true)
                echo "Reusing Linux engine: $binary"
                ;;
              false|'')
                echo "Building Linux engine: $binary"
                if test "$name" = naive; then
                  ccache --zero-stats
                  echo 'naive_ccache_used=true' >> "$GITHUB_OUTPUT"
                fi
                wails3 task "native:$task" TARGET_OS=linux TARGET_ARCH=amd64
                rm -rf "$cache_directory"
                mkdir -p "$cache_directory"
                install -m 0755 "bin/engines/linux-amd64/$binary" "$cache_directory/binary"
                printf '%s\n' "$key" > "$cache_directory/key"
                (cd "$cache_directory" && sha256sum --binary binary > binary.sha256)
                ;;
              *) echo "Invalid cache status for $binary" >&2; exit 1 ;;
            esac
            # Reject partial, corrupt or substituted entries before staging them.
            if ! validate_cache "$cache_directory" "$key"; then
              echo "Invalid cached Linux engine: $binary" >&2
              exit 1
            fi
            install -m 0755 "$cache_directory/binary" "bin/engines/linux-amd64/$binary"
          done <<< "$specification"
      - name: bash - Report NaiveProxy Compiler Cache Statistics
        if: ${{ !cancelled() && steps.engine_build.outputs.naive_ccache_used == 'true' }}
        shell: bash
        run: ccache --show-stats
      - name: actions/cache/save@v6 - Save NaiveProxy Compiler Cache
        # Preserve successful compilations even when a later build command fails.
        if: ${{ !cancelled() && steps.engine_build.outputs.naive_ccache_used == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.naive_ccache.outputs.cache-primary-key }}
      - name: bash - Build and Record Linux Payloads
        working-directory: source/app
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          git rev-parse HEAD > bin/engines/linux-amd64.revision
          cd bin
          engines=(engines/linux-amd64/{xray,hysteria,amneziawg-go,trusttunnel_client,trusttunnel_endpoint,naive,naiveproxy-server})
          sha256sum --binary "${engines[@]}" > engines/linux-amd64.sha256
          (cd .. && wails3 task native:verify:prebuilt)
          tar -czf linux-engines.tar.gz "${engines[@]}" engines/linux-amd64.sha256 engines/linux-amd64.revision
      - name: actions/upload-artifact@v7 - Upload Linux Engine Payloads
        uses: actions/upload-artifact@v7
        with:
          name: snoo-box-linux-engines
          path: source/app/bin/linux-engines.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [prepare, linux-engines]
    environment: snoo-box
    env:
      SNOO_PREBUILT_LINUX_ENGINES: 'true'
      GO_CACHE_TARGET: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, os: ubuntu-latest}
          - {platform: android, os: ubuntu-latest}
          - {platform: windows, os: windows-latest}
          - {platform: macos, os: macos-latest}
          - {platform: ios, os: macos-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - name: actions/checkout@v7 - Check Out Pinned Source
        uses: actions/checkout@v7
        with:
          repository: ParkSnoopy/snoo-box
          ref: ${{ needs.prepare.outputs.revision }}
          path: source
          submodules: recursive
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - *restore-engine-tags
      - *setup-go
      - *go-cache-paths
      - *restore-go-cache
      - name: oven-sh/setup-bun@v2 - Set Up Bun
        uses: oven-sh/setup-bun@v2
      - name: actions/download-artifact@v8 - Download Linux Engine Payloads
        uses: actions/download-artifact@v8
        with:
          name: snoo-box-linux-engines
          path: payload
          github-token: ${{ env.GH_TOKEN }}
      - name: bash - Restore Verified Linux Payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/app/bin
          tar -xzf payload/linux-engines.tar.gz -C source/app/bin
      - *restore-apt-downloads
      - name: bash - Install Linux Dependencies
        if: matrix.platform == 'linux' || matrix.platform == 'android'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/snoo-box-apt-cache"
          sudo apt-get update -o Dir::Etc::sourcelist='sources.list.d/ubuntu.sources' -o Dir::Etc::sourceparts='-' -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o Dir::Cache::archives="$RUNNER_TEMP/snoo-box-apt-cache" -o APT::Keep-Downloaded-Packages=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: actions/setup-java@v6 - Set Up Java
        uses: actions/setup-java@v6
        id: setup_java
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          # AGP 8.7.3's bundled lint rejects JDK 25; select the newest compatible GA release.
          java-version: '>=17 <25'
          check-latest: true
      - name: android-actions/setup-android@v4 - Set Up Android SDK
        uses: android-actions/setup-android@v4
        if: matrix.platform == 'android'
        with:
          packages: ''
      - name: actions/cache@v6 - Restore Android Dependency Downloads
        if: matrix.platform == 'android'
        uses: actions/cache@v6
        with:
          # Only dependency downloads: no signed APKs, keystores, daemon state
          # or project build outputs belong in this cache.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: snoo-box-gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup_java.outputs.version }}-${{ hashFiles('source/app/build/android/**/*.gradle', 'source/app/build/android/**/*.gradle.kts', 'source/app/build/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            snoo-box-gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup_java.outputs.version }}-
      - name: bash - Install Android SDK and Signing Key
        if: matrix.platform == 'android'
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEY:?Set ANDROID_KEYSTORE_BASE64 for snoo-box}"
          : "${STORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD for snoo-box}"
          : "${KEY_ALIAS:?Set ANDROID_KEY_ALIAS for snoo-box}"
          : "${KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD for snoo-box}"
          available="$(sdkmanager --list --channel=0)"
          ndk="$(printf '%s\n' "$available" | python3 -c 'import re,sys; versions=set(re.findall(r"^\s*ndk;([0-9]+(?:\.[0-9]+)+)\s*\|",sys.stdin.read(),re.M)); print(max(versions,key=lambda v:tuple(map(int,v.split(".")))))')"
          tools="$(printf '%s\n' "$available" | python3 -c 'import re,sys; versions=set(re.findall(r"^\s*build-tools;([0-9]+(?:\.[0-9]+)+)\s*\|",sys.stdin.read(),re.M)); print(max(versions,key=lambda v:tuple(map(int,v.split(".")))))')"
          sdkmanager "ndk;$ndk" 'platforms;android-35' "build-tools;$tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/$tools" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/snoo-box.jks"
          keytool -list -keystore "$RUNNER_TEMP/snoo-box.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/snoo-box.jks" >> "$GITHUB_ENV"
      - name: pwsh - Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed with exit code $LASTEXITCODE" }
          $nsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (!(Test-Path -LiteralPath (Join-Path $nsisDirectory 'makensis.exe') -PathType Leaf)) {
            throw "NSIS compiler not found in $nsisDirectory"
          }
          $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: bash - Expose Git Utilities to Native Windows Tasks
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # Wails/Task resolves external commands with Windows PATH, not Bash's /usr/bin.
          test -f /usr/bin/sha256sum.exe
          test -f /usr/bin/cmp.exe
          cygpath -w /usr/bin >> "$GITHUB_PATH"
      - name: pwsh - Verify Native Windows Utility Lookup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in @('sha256sum.exe', 'cmp.exe')) {
            $command = Get-Command $tool -CommandType Application -ErrorAction Stop
            & $command.Source --version
            if ($LASTEXITCODE -ne 0) { throw "$tool failed with exit code $LASTEXITCODE" }
          }
          $nsis = Get-Command makensis.exe -CommandType Application -ErrorAction Stop
          & $nsis.Source /VERSION
          if ($LASTEXITCODE -ne 0) { throw "NSIS compiler failed with exit code $LASTEXITCODE" }
      - *install-wails
      - name: bash - Verify Imported Engine Payloads
        working-directory: source/app
        shell: bash
        run: wails3 task native:verify:prebuilt
      - name: bash - Package Application
        working-directory: source/app
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            linux)
              # Build only the portable bundle, not DEB/RPM/Arch packages.
              wails3 task linux:create:bundle
              wails3 task cli:package
              ;;
            android) wails3 task android:package ARCH=arm64 ;;
            windows) wails3 task windows:package ARCH=amd64 ;;
            macos) wails3 task darwin:package ARCH=arm64 ;;
            ios) wails3 task ios:package IOS_PLATFORM=simulator ;;
            *) exit 1 ;;
          esac
      - name: bash - Stage Release Packages
        working-directory: source/app
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          prefix="Snoo_Box_v$VERSION"
          mkdir -p dist
          case "$PLATFORM" in
            linux)
              test -s bin/snoo-box-linux-amd64.tar.gz
              tar -tzf bin/snoo-box-linux-amd64.tar.gz | grep -x 'snoo-box-linux-amd64/snoo-box' > /dev/null
              test -s bin/snoo-box-cli-linux-amd64.zip
              cp bin/snoo-box-linux-amd64.tar.gz "dist/$prefix-amd64-Linux.tar.gz"
              cp bin/snoo-box-cli-linux-amd64.zip "dist/$prefix-amd64-Linux_CLI.zip"
              ;;
            android)
              test -s bin/snoo-box.apk
              "$ANDROID_BUILD_TOOLS/apksigner" verify --min-sdk-version 21 --verbose bin/snoo-box.apk
              cp bin/snoo-box.apk "dist/$prefix-arm64-Android.apk"
              ;;
            windows)
              test -s bin/snoo-box-amd64-installer.exe
              cp bin/snoo-box-amd64-installer.exe "dist/$prefix-amd64-Windows.exe"
              ;;
            macos)
              test -d bin/snoo-box.app
              ditto -c -k --sequesterRsrc --keepParent bin/snoo-box.app "dist/$prefix-arm64-macOS.zip"
              ;;
            ios)
              test -d bin/snoo-box.app
              ditto -c -k --sequesterRsrc --keepParent bin/snoo-box.app "dist/$prefix-arm64-iOS_Simulator.zip"
              ;;
            *) exit 1 ;;
          esac
      - name: actions/upload-artifact@v7 - Upload Release Packages
        uses: actions/upload-artifact@v7
        with:
          name: snoo-box-release-${{ matrix.platform }}
          path: source/app/dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: actions/checkout@v7 - Check Out Release Action
        uses: actions/checkout@v7
        with:
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - name: ./.github/actions/publish-release - Publish Release
        uses: ./.github/actions/publish-release
        with:
          repository: snoo-box
          title: Snoo Box
          version: ${{ needs.prepare.outputs.version }}
          token: ${{ secrets.RELEASE_TOKEN }}
