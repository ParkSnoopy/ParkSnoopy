name: Snoo Box

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: snoo-box
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.CLONE_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: actions/checkout@v7 - Check Out Source
        uses: actions/checkout@v7
        with:
          repository: ParkSnoopy/snoo-box
          path: source
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - name: bash - Resolve Source Revision
        id: source
        run: |
          set -euo pipefail
          revision="$(git -C source rev-parse HEAD)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          version="$(sed -n 's/^const AppVersion = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' source/app/src/internal/core/buildinfo/version.go)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if ! grep -Fq 'verify:prebuilt:' source/engines/Taskfile.yml; then
            echo 'The source revision lacks shared Linux payload support; publish the snoo-box build-graph fix before dispatching this workflow.' >&2
            exit 1
          fi
          if ! grep -Fq 'verify:overlay-hub:' source/app/build/Taskfile.yml; then
            echo 'The source revision lacks shared overlay hub support; publish the snoo-box build-graph fix before dispatching this workflow.' >&2
            exit 1
          fi
          if [[ "$(grep -Fc -- '-ldflags="-checklinkname=0 {{.REVISION_LDFLAGS}}' source/app/build/android/Taskfile.yml)" != 2 ]]; then
            echo 'The source revision lacks Android shared-library link compatibility; publish the snoo-box Android build fix before dispatching this workflow.' >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux-engines:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      GO_CACHE_TARGET: linux-engines
    steps:
      - name: actions/checkout@v7 - Check Out Pinned Source
        uses: actions/checkout@v7
        with:
          repository: ParkSnoopy/snoo-box
          ref: ${{ needs.prepare.outputs.revision }}
          path: source
          submodules: recursive
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - &restore-engine-tags
        name: bash - Restore Engine Release Tags
        shell: bash
        run: |
          set -euo pipefail
          for engine in xray-core hysteria; do
            directory="source/protocols/$engine"
            if [[ "$(git -C "$directory" rev-parse --is-shallow-repository)" == true ]]; then
              git -C "$directory" fetch --unshallow --tags
            else
              git -C "$directory" fetch --tags
            fi
          done
      - &setup-go
        name: actions/setup-go@v7 - Set Up Go
        uses: actions/setup-go@v7
        id: setup_go
        with:
          go-version: stable
          check-latest: true
          cache: false
      - &go-cache-paths
        name: bash - Resolve Go Cache Directories
        id: go_cache_paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "build=$(go env GOCACHE)"
            echo "modules=$(go env GOMODCACHE)"
            echo "image=$ImageVersion"
          } >> "$GITHUB_OUTPUT"
      - &restore-go-cache
        name: actions/cache@v6 - Restore Go Compiler and Module Cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go_cache_paths.outputs.build }}
            ${{ steps.go_cache_paths.outputs.modules }}
          key: snoo-box-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_CACHE_TARGET }}-${{ steps.setup_go.outputs.go-version }}-${{ hashFiles('source/**/go.mod', 'source/**/go.sum', 'source/**/go.work', 'source/**/go.work.sum') }}-${{ needs.prepare.outputs.revision }}
          # Prefix reuse is safe for Go's content-addressed compilation cache,
          # never for finished engine binaries. New source revisions save
          # refreshed compiler outputs instead of freezing the first snapshot.
          restore-keys: |
            snoo-box-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_CACHE_TARGET }}-${{ steps.setup_go.outputs.go-version }}-${{ hashFiles('source/**/go.mod', 'source/**/go.sum', 'source/**/go.work', 'source/**/go.work.sum') }}-
            snoo-box-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_CACHE_TARGET }}-${{ steps.setup_go.outputs.go-version }}-
      - &restore-apt-downloads
        name: actions/cache@v6 - Restore Linux Package Downloads
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          # Cache archives only, not root-owned APT locks or partial downloads.
          # APT still resolves and verifies the current repository packages.
          path: ${{ runner.temp }}/snoo-box-apt-cache/*.deb
          key: snoo-box-apt-v1-${{ runner.arch }}-${{ steps.go_cache_paths.outputs.image }}-${{ env.GO_CACHE_TARGET }}-${{ needs.prepare.outputs.revision }}
          restore-keys: |
            snoo-box-apt-v1-${{ runner.arch }}-${{ steps.go_cache_paths.outputs.image }}-${{ env.GO_CACHE_TARGET }}-
      - name: bash - Install Linux Engine Toolchains
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/snoo-box-apt-cache"
          sudo apt-get update -o Dir::Etc::sourcelist='sources.list.d/ubuntu.sources' -o Dir::Etc::sourceparts='-' -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o Dir::Cache::archives="$RUNNER_TEMP/snoo-box-apt-cache" -o APT::Keep-Downloaded-Packages=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - &install-wails
        name: bash - Install Wails CLI from Application Module
        working-directory: source/app
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$(mktemp -d)"
          trap 'rm -r "$tools_dir"' EXIT
          cp go.mod go.sum "$tools_dir/"
          # Keep local replacements rooted in the app; isolate CLI-only edits.
          GOBIN="$(go env GOPATH)/bin" go install -mod=mod -modfile="$tools_dir/go.mod" github.com/wailsapp/wails/v3/cmd/wails3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: bash - Build Linux Engines
        working-directory: source/app
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          wails3 task native:verify
          mkdir -p bin/engines/linux-amd64
          for task in xray hysteria; do
            wails3 task "native:$task" TARGET_OS=linux TARGET_ARCH=amd64
            test -x "bin/engines/linux-amd64/$task"
          done
      - name: bash - Build and Record Linux Payloads
        working-directory: source/app
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          wails3 task common:build:overlay-hub
          test -f bin/overlay-hub && test -s bin/overlay-hub && test -x bin/overlay-hub && ! test -L bin/overlay-hub
          git rev-parse HEAD > bin/engines/linux-amd64.revision
          cd bin
          engines=(engines/linux-amd64/{xray,hysteria})
          sha256sum --binary "${engines[@]}" > engines/linux-amd64.sha256
          sha256sum --binary overlay-hub > overlay-hub.sha256
          (cd .. && wails3 task common:verify:overlay-hub)
          tar -czf linux-engines.tar.gz "${engines[@]}" engines/linux-amd64.sha256 engines/linux-amd64.revision overlay-hub overlay-hub.sha256
      - name: actions/upload-artifact@v7 - Upload Linux Engine Payloads
        uses: actions/upload-artifact@v7
        with:
          name: snoo-box-linux-engines
          path: source/app/bin/linux-engines.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [prepare, linux-engines]
    environment: snoo-box
    env:
      SNOO_PREBUILT_LINUX_ENGINES: 'true'
      GO_CACHE_TARGET: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, os: ubuntu-latest}
          - {platform: android, os: ubuntu-latest}
          - {platform: windows, os: windows-latest}
          - {platform: macos, os: macos-latest}
          - {platform: ios, os: macos-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - name: actions/checkout@v7 - Check Out Pinned Source
        uses: actions/checkout@v7
        with:
          repository: ParkSnoopy/snoo-box
          ref: ${{ needs.prepare.outputs.revision }}
          path: source
          submodules: recursive
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - *restore-engine-tags
      - *setup-go
      - *go-cache-paths
      - *restore-go-cache
      - name: oven-sh/setup-bun@v2 - Set Up Bun
        uses: oven-sh/setup-bun@v2
      - name: actions/download-artifact@v8 - Download Linux Engine Payloads
        uses: actions/download-artifact@v8
        with:
          name: snoo-box-linux-engines
          path: payload
          github-token: ${{ env.GH_TOKEN }}
      - name: bash - Restore Verified Linux Payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/app/bin
          tar -xzf payload/linux-engines.tar.gz -C source/app/bin
      - *restore-apt-downloads
      - name: bash - Install Linux Dependencies
        if: matrix.platform == 'linux' || matrix.platform == 'android'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/snoo-box-apt-cache"
          sudo apt-get update -o Dir::Etc::sourcelist='sources.list.d/ubuntu.sources' -o Dir::Etc::sourceparts='-' -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o Dir::Cache::archives="$RUNNER_TEMP/snoo-box-apt-cache" -o APT::Keep-Downloaded-Packages=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: actions/setup-java@v6 - Set Up Java
        uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          # AGP 8.7.3's bundled lint rejects JDK 25; select the newest compatible GA release.
          java-version: '>=17 <25'
          check-latest: true
      - name: android-actions/setup-android@v4 - Set Up Android SDK
        uses: android-actions/setup-android@v4
        if: matrix.platform == 'android'
        with:
          packages: ''
      - name: bash - Install Android SDK and Signing Key
        if: matrix.platform == 'android'
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEY:?Set ANDROID_KEYSTORE_BASE64 for snoo-box}"
          : "${STORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD for snoo-box}"
          : "${KEY_ALIAS:?Set ANDROID_KEY_ALIAS for snoo-box}"
          : "${KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD for snoo-box}"
          available="$(sdkmanager --list --channel=0)"
          ndk="$(printf '%s\n' "$available" | python3 -c 'import re,sys; versions=set(re.findall(r"^\s*ndk;([0-9]+(?:\.[0-9]+)+)\s*\|",sys.stdin.read(),re.M)); print(max(versions,key=lambda v:tuple(map(int,v.split(".")))))')"
          tools="$(printf '%s\n' "$available" | python3 -c 'import re,sys; versions=set(re.findall(r"^\s*build-tools;([0-9]+(?:\.[0-9]+)+)\s*\|",sys.stdin.read(),re.M)); print(max(versions,key=lambda v:tuple(map(int,v.split(".")))))')"
          sdkmanager "ndk;$ndk" 'platforms;android-35' "build-tools;$tools"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk"
            echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/$tools"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/snoo-box.jks"
          keytool -list -keystore "$RUNNER_TEMP/snoo-box.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/snoo-box.jks" >> "$GITHUB_ENV"
      - name: pwsh - Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed with exit code $LASTEXITCODE" }
          $nsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (!(Test-Path -LiteralPath (Join-Path $nsisDirectory 'makensis.exe') -PathType Leaf)) {
            throw "NSIS compiler not found in $nsisDirectory"
          }
          $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: pwsh - Check Windows Signing Inputs
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64) -or
              [string]::IsNullOrEmpty($env:WINDOWS_CODESIGN_PFX_PASSWORD)) {
            throw 'Set WINDOWS_CODESIGN_PFX_BASE64 and WINDOWS_CODESIGN_PFX_PASSWORD in the snoo-box environment.'
          }
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signTool = Get-ChildItem -Path "$sdk\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (!$signTool) { throw 'Windows SDK SignTool is missing.' }
          "WINDOWS_SIGNTOOL=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: bash - Expose Git Utilities to Native Windows Tasks
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # Wails/Task resolves external commands with Windows PATH, not Bash's /usr/bin.
          test -f /usr/bin/sha256sum.exe
          test -f /usr/bin/cmp.exe
          cygpath -w /usr/bin >> "$GITHUB_PATH"
      - name: pwsh - Verify Native Windows Utility Lookup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in @('sha256sum.exe', 'cmp.exe')) {
            $command = Get-Command $tool -CommandType Application -ErrorAction Stop
            & $command.Source --version
            if ($LASTEXITCODE -ne 0) { throw "$tool failed with exit code $LASTEXITCODE" }
          }
          $nsis = Get-Command makensis.exe -CommandType Application -ErrorAction Stop
          & $nsis.Source /VERSION
          if ($LASTEXITCODE -ne 0) { throw "NSIS compiler failed with exit code $LASTEXITCODE" }
      - *install-wails
      - name: bash - Verify Imported Engine Payloads
        working-directory: source/app
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            macos) namespace=darwin ;;
            linux|android|windows|ios) namespace="$PLATFORM" ;;
            *) exit 1 ;;
          esac
          # Exercise the same nested include used by frontend/binding builds.
          wails3 task "$namespace:common:verify:overlay-hub"
      - name: bash - Package Application
        working-directory: source/app
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            linux)
              # Build only the portable bundle, not DEB/RPM/Arch packages.
              wails3 task linux:create:bundle
              wails3 task cli:package
              ;;
            android) wails3 task android:package ARCH=arm64 ;;
            windows) wails3 task windows:package ARCH=amd64 ;;
            macos) wails3 task darwin:package ARCH=arm64 ;;
            ios) wails3 task ios:package IOS_PLATFORM=simulator ;;
            *) exit 1 ;;
          esac
      - name: pwsh - Sign and Verify Windows Installer
        if: matrix.platform == 'windows'
        shell: pwsh
        timeout-minutes: 3
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'snoo-box-windows-signing'
          $null = New-Item -ItemType Directory -Path $directory
          $pfx = Join-Path $directory 'signing.pfx'
          $added = @()
          try {
            Write-Host 'Loading and validating the signing certificate.'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CODESIGN_PFX_PASSWORD -AsPlainText -Force
            $certificate = Get-PfxData -FilePath $pfx -Password $password
            $leaf = @($certificate.EndEntityCertificates)
            if ($leaf.Count -ne 1) { throw 'Expected exactly one signing certificate.' }
            $leaf = $leaf[0]
            if ($leaf.NotBefore -gt (Get-Date) -or $leaf.NotAfter -le (Get-Date)) {
              throw 'Signing certificate is not currently valid.'
            }
            # Read the X.509 EKU extension, not PowerShell's display-oriented adapter.
            $eku = $leaf.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.37' }
            if (!$eku -or '1.3.6.1.5.5.7.3.3' -notin @(
                ([Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new(
                  $eku, $eku.Critical)).EnhancedKeyUsages.Value)) {
              throw 'Certificate does not permit code signing.'
            }
            $thumbprint = $leaf.Thumbprint
            # Approved temporary public-certificate trust on this disposable runner.
            # CurrentUser\Root can display a hidden confirmation dialog in CI.
            Write-Host 'Installing temporary machine trust for the supplied public certificate.'
            foreach ($storeName in @('Root', 'TrustedPeople')) {
              $store = [Security.Cryptography.X509Certificates.X509Store]::new($storeName, 'LocalMachine')
              try {
                $store.Open('ReadWrite')
                if ($store.Certificates.Find('FindByThumbprint', $thumbprint, $false).Count -eq 0) {
                  $added += "Cert:\LocalMachine\$storeName\$thumbprint"
                  # Record ownership before mutation so cancellation cleanup can recover.
                  ConvertTo-Json -InputObject $added | Set-Content -LiteralPath (Join-Path $directory 'added.json')
                  $store.Add($leaf)
                }
              } finally { $store.Close() }
            }
            $installer = (Resolve-Path 'source/app/bin/snoo-box-amd64-installer.exe').Path
            Write-Host 'Signing the installer and requesting a SHA-256 timestamp.'
            & $env:WINDOWS_SIGNTOOL sign /f $pfx /p $env:WINDOWS_CODESIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer
            if ($LASTEXITCODE -ne 0) { throw "Installer signing failed: $LASTEXITCODE" }
            Write-Host 'Verifying installer integrity, signer identity, and timestamp.'
            & $env:WINDOWS_SIGNTOOL verify /pa /all /v $installer
            if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed: $LASTEXITCODE" }
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $thumbprint -or
                !$signature.TimeStamperCertificate) {
              throw 'Installer must have a valid signature from the supplied certificate and a timestamp.'
            }
            Write-Host 'Installer signature and timestamp verified.'
          } finally {
            Write-Host 'Removing temporary signing material and certificate trust.'
            foreach ($entry in $added) {
              if (Test-Path -LiteralPath $entry) { Remove-Item -LiteralPath $entry -Force }
            }
            Remove-Item -LiteralPath $directory -Recurse -Force
          }
      - name: pwsh - Clean Up Interrupted Windows Signing
        if: ${{ always() && matrix.platform == 'windows' }}
        shell: pwsh
        timeout-minutes: 1
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'snoo-box-windows-signing'
          $record = Join-Path $directory 'added.json'
          if (Test-Path -LiteralPath $record) {
            foreach ($entry in @(Get-Content -LiteralPath $record -Raw | ConvertFrom-Json)) {
              if ($entry -notmatch '^Cert:\\LocalMachine\\(Root|TrustedPeople)\\[0-9A-F]{40}$') {
                throw 'Invalid temporary certificate cleanup record.'
              }
              if (Test-Path -LiteralPath $entry) { Remove-Item -LiteralPath $entry -Force }
            }
          }
          if (Test-Path -LiteralPath $directory) { Remove-Item -LiteralPath $directory -Recurse -Force }
      - name: bash - Stage Release Packages
        working-directory: source/app
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          prefix="Snoo_Box_v$VERSION"
          mkdir -p dist
          case "$PLATFORM" in
            linux)
              test -s bin/snoo-box-linux-amd64.tar.gz
              tar -tzf bin/snoo-box-linux-amd64.tar.gz | grep -x 'snoo-box-linux-amd64/snoo-box' > /dev/null
              test -s bin/snoo-box-cli-linux-amd64.zip
              cp bin/snoo-box-linux-amd64.tar.gz "dist/$prefix-amd64-Linux.tar.gz"
              cp bin/snoo-box-cli-linux-amd64.zip "dist/$prefix-amd64-Linux_CLI.zip"
              ;;
            android)
              test -s bin/snoo-box.apk
              "$ANDROID_BUILD_TOOLS/apksigner" verify --min-sdk-version 21 --verbose bin/snoo-box.apk
              cp bin/snoo-box.apk "dist/$prefix-arm64-Android.apk"
              ;;
            windows)
              test -s bin/snoo-box-amd64-installer.exe
              cp bin/snoo-box-amd64-installer.exe "dist/$prefix-amd64-Windows.exe"
              ;;
            macos)
              test -d bin/snoo-box.app
              ditto -c -k --sequesterRsrc --keepParent bin/snoo-box.app "dist/$prefix-arm64-macOS.zip"
              ;;
            ios)
              test -d bin/snoo-box.app
              ditto -c -k --sequesterRsrc --keepParent bin/snoo-box.app "dist/$prefix-arm64-iOS_Simulator.zip"
              ;;
            *) exit 1 ;;
          esac
      - name: actions/upload-artifact@v7 - Upload Release Packages
        uses: actions/upload-artifact@v7
        with:
          name: snoo-box-release-${{ matrix.platform }}
          path: source/app/dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: actions/checkout@v7 - Check Out Release Action
        uses: actions/checkout@v7
        with:
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - name: ./.github/actions/publish-release - Publish Release
        uses: ./.github/actions/publish-release
        with:
          repository: snoo-box
          title: Snoo Box
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.revision }}
          token: ${{ secrets.RELEASE_TOKEN }}
