name: snoo-box

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: snoo-box
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.CLONE_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Resolve source revision
        id: source
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          revision="$(gh api repos/ParkSnoopy/snoo-box/commits/main --jq .sha)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    environment: snoo-box
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, os: ubuntu-24.04}
          - {platform: android, os: ubuntu-24.04}
          - {platform: windows, os: windows-2022}
          - {platform: macos, os: macos-15}
          - {platform: ios, os: macos-15}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ParkSnoopy/snoo-box
          ref: ${{ needs.prepare.outputs.revision }}
          path: source
          submodules: recursive
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/app/go.mod
          cache: false
      - uses: oven-sh/setup-bun@v2
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update -o Dir::Etc::sourcelist='sources.list.d/ubuntu.sources' -o Dir::Etc::sourceparts='-'
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libfuse2t64
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
      - name: Install Android SDK and signing key
        if: matrix.platform == 'android'
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEY:?Set ANDROID_KEYSTORE_BASE64 for snoo-box}"
          : "${STORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD for snoo-box}"
          : "${KEY_ALIAS:?Set ANDROID_KEY_ALIAS for snoo-box}"
          : "${KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD for snoo-box}"
          sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/snoo-box.jks"
          keytool -list -keystore "$RUNNER_TEMP/snoo-box.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/snoo-box.jks" >> "$GITHUB_ENV"
      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Install Wails CLI from application module
        working-directory: source/app
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v3/cmd/wails3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Package application
        working-directory: source/app
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            linux) wails3 task package ;;
            android) wails3 task android:package ARCH=arm64 ;;
            windows) wails3 task windows:package ARCH=amd64 ;;
            macos) wails3 task darwin:package ARCH=arm64 ;;
            ios) wails3 task ios:package IOS_PLATFORM=simulator ;;
            *) exit 1 ;;
          esac
      - name: Stage release packages
        working-directory: source/app
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "$PLATFORM" in
            linux)
              shopt -s nullglob
              packages=(bin/*.AppImage bin/*.deb bin/*.rpm bin/*.pkg.tar.*)
              (( ${#packages[@]} == 4 ))
              cp "${packages[@]}" dist/
              ;;
            android)
              test -s bin/snoo-box.apk
              "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 21 --verbose bin/snoo-box.apk
              cp bin/snoo-box.apk dist/snoo-box-android-arm64.apk
              ;;
            windows)
              test -s bin/snoo-box-amd64-installer.exe
              cp bin/snoo-box-amd64-installer.exe dist/
              ;;
            macos)
              test -d bin/snoo-box.app
              ditto -c -k --sequesterRsrc --keepParent bin/snoo-box.app dist/snoo-box-macos-arm64.zip
              ;;
            ios)
              test -d bin/snoo-box.app
              ditto -c -k --sequesterRsrc --keepParent bin/snoo-box.app dist/snoo-box-ios-simulator-arm64.zip
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: snoo-box-release-${{ matrix.platform }}
          path: source/app/dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - uses: ./.github/actions/publish-release
        with:
          repository: snoo-box
          token: ${{ secrets.RELEASE_TOKEN }}