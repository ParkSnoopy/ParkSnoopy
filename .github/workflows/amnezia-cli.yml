name: Amnezia CLI

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: amnezia-cli
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.CLONE_TOKEN }}

jobs:
  build:
    # The application and its routing implementation support Linux only.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - name: bash - Check Repository Access
        run: |
          set -euo pipefail
          test "$GH_TOKEN" != ""
          gh api "repos/$GITHUB_REPOSITORY" >/dev/null
      - name: actions/checkout@v7 - Check Out Source
        uses: actions/checkout@v7
        with:
          repository: ParkSnoopy/amnezia-cli
          token: ${{ env.GH_TOKEN }}
          submodules: recursive
          persist-credentials: false
      - name: actions/setup-go@v7 - Set Up Go
        uses: actions/setup-go@v7
        with:
          # Native engine modules require newer Go than the root module.
          go-version: stable
          check-latest: true
          cache: false
      - name: bash - Build and Package Complete Bundle
        id: package
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja
          cmake --build build
          version="$(build/dist/amn version)"
          version="${version##* }"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for binary in amn libexec/amn/xray libexec/amn/wireguard-go libexec/amn/amneziawg-go; do
            test -x "build/dist/$binary"
          done
          mkdir -p package/amnezia-cli dist
          cp -a build/dist/. package/amnezia-cli/
          tar -C package -czf "dist/Amnezia_CLI_v$version-amd64-Linux_CLI.tar.gz" amnezia-cli
      - name: actions/upload-artifact@v7 - Upload Release Bundle
        uses: actions/upload-artifact@v7
        with:
          name: amnezia-cli-release-linux
          path: dist/Amnezia_CLI_v*-amd64-Linux_CLI.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: actions/checkout@v7 - Check Out Release Action
        uses: actions/checkout@v7
        with:
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - name: ./.github/actions/publish-release - Publish Release
        uses: ./.github/actions/publish-release
        with:
          repository: amnezia-cli
          title: Amnezia CLI
          version: ${{ needs.build.outputs.version }}
          token: ${{ secrets.RELEASE_TOKEN }}