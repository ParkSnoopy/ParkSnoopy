name: Love

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: Love
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.CLONE_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    environment: Love
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: bash - Check Access and Signing Secrets
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test "$GH_TOKEN" != ""
          test "$KEY" != ""
          test "$STORE_PASSWORD" != ""
          test "$KEY_PASSWORD" != ""
          test "$KEY_ALIAS" != ""
          gh api "repos/$GITHUB_REPOSITORY" >/dev/null
      - name: actions/checkout@v7 - Check Out Source
        uses: actions/checkout@v7
        with:
          repository: ParkSnoopy/Love
          token: ${{ env.GH_TOKEN }}
          lfs: true
          persist-credentials: false
      - name: bash - Resolve Source Revision
        id: source
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: bash - Compile Corpus and Package Assets
        run: |
          set -euo pipefail
          sudo apt-get update \
            -o Dir::Etc::sourcelist='sources.list.d/ubuntu.sources' \
            -o Dir::Etc::sourceparts='-'
          sudo apt-get install -y libxml2-utils zip
          python3 tools/compile_corpus.py
          zip -q data.zip assets/data.zip assets/data/manifest.json \
            assets/fonts/NotoSansCJK.ttc assets/fonts/NotoSerifCJK.ttc
      - name: actions/upload-artifact@v7 - Upload Build Assets
        uses: actions/upload-artifact@v7
        with:
          name: Love-data
          path: data.zip
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    environment: Love
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: android, os: ubuntu-24.04}
          - {platform: linux, os: ubuntu-24.04}
          - {platform: windows, os: windows-2022}
          - {platform: macos, os: macos-15}
          - {platform: ios, os: macos-15}
          - {platform: ios-simulator, os: macos-15}
    runs-on: ${{ matrix.os }}
    steps:
      - name: actions/checkout@v7 - Check Out Workflow Actions
        uses: actions/checkout@v7
        with:
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - name: actions/checkout@v7 - Check Out Pinned Source
        uses: actions/checkout@v7
        with:
          repository: ParkSnoopy/Love
          ref: ${{ needs.prepare.outputs.revision }}
          path: source
          token: ${{ env.GH_TOKEN }}
          lfs: false
          persist-credentials: false
      - name: ./.github/actions/flutter-build - Build Flutter Platform
        uses: ./.github/actions/flutter-build
        with:
          repository: Love
          title: Love
          platform: ${{ matrix.platform }}
          revision: ${{ needs.prepare.outputs.revision }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: actions/checkout@v7 - Check Out Release Action
        uses: actions/checkout@v7
        with:
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false
      - name: ./.github/actions/publish-release - Publish Release
        uses: ./.github/actions/publish-release
        with:
          repository: Love
          title: Love
          version: ${{ needs.prepare.outputs.version }}
          token: ${{ secrets.RELEASE_TOKEN }}