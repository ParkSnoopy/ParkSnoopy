name: Build Flutter Platform
description: Build and archive an already prepared native Flutter source tree.
inputs:
  repository:
    description: Source repository name.
    required: true
  title:
    description: Existing project display title used in release filenames.
    required: true
  platform:
    description: Android, Linux, macOS, Windows, iOS, or iOS simulator target.
    required: true
  revision:
    description: Exact source commit.
    required: true
runs:
  using: composite
  steps:
    - name: actions/download-artifact@v8 - Download Build Assets
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.repository }}-data
        path: source
        github-token: ${{ env.GH_TOKEN }}
    - name: bash - Restore Build Assets
      working-directory: source
      shell: bash
      run: unzip -q -o data.zip
    - name: actions/setup-java@v6 - Set Up Java
      uses: actions/setup-java@v6
      if: inputs.platform == 'android'
      with:
        distribution: temurin
        java-version: '17'
    - name: bash - Restore Android Signing Key
      if: inputs.platform == 'android'
      working-directory: source
      shell: bash
      run: |
        set -euo pipefail
        test "$ANDROID_KEYSTORE_BASE64" != ""
        test "$ANDROID_KEYSTORE_PASSWORD" != ""
        test "$ANDROID_KEY_ALIAS" != ""
        test "$ANDROID_KEY_PASSWORD" != ""
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
        keytool -list -keystore "$RUNNER_TEMP/release.jks" \
          -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
        echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
    - name: bash - Install Linux Dependencies
      if: inputs.platform == 'linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update \
          -o Dir::Etc::sourcelist='sources.list.d/ubuntu.sources' \
          -o Dir::Etc::sourceparts='-'
        sudo apt-get install -y clang cmake ninja-build pkg-config \
          libgtk-3-dev liblzma-dev libsqlite3-dev libayatana-appindicator3-dev \
          libsecret-1-dev libjsoncpp-dev
    - name: subosito/flutter-action@v2 - Set Up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - name: bash - Build and Package
      working-directory: source
      shell: bash
      env:
        PROGRAM: ${{ inputs.repository }}
        DISPLAY_NAME: ${{ inputs.title }}
        PLATFORM: ${{ inputs.platform }}
        SOURCE_SHA: ${{ inputs.revision }}
      run: |
        set -euo pipefail
        flutter pub get
        version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        prefix="${DISPLAY_NAME//[[:space:]]/_}_v$version"
        IFS=. read -r major minor patch <<< "$version"
        (( 10#$minor < 1000 && 10#$patch < 1000 ))
        number=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
        (( number >= 1 && number <= 2100000000 ))
        args=(--build-name "$version" --build-number "$number" "--dart-define=BUILD_COMMIT=$SOURCE_SHA")
        mkdir -p ../dist
        archive_apple_bundle() {
          local bundle=$1 native_arch=$2 architecture=$3 platform=$4 info executable payload_file actual_arch
          if [[ "$platform" == macOS ]]; then
            info="$bundle/Contents/Info.plist"
            payload_file="$bundle/Contents/MacOS"
          else
            info="$bundle/Info.plist"
            payload_file="$bundle"
          fi
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info")
          actual_arch="$(lipo -archs "$payload_file/$executable")"
          if [[ "$actual_arch" != "$native_arch" ]]; then
            echo "Expected $native_arch in $bundle; found $actual_arch" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "../dist/$prefix-$architecture-$platform.zip"
        }
        case "$PLATFORM" in
          android)
            flutter build apk --release --target-platform android-arm64,android-x64 --split-per-abi "${args[@]}"
            for apksigner in "$ANDROID_HOME"/build-tools/*/apksigner; do
              [[ -x "$apksigner" ]] && break
            done
            test -x "$apksigner"
            # Enforce the CI key separately for each supported 64-bit ABI.
            for architecture in amd64 arm64; do
              case "$architecture" in
                amd64) abi=x86_64 ;;
                arm64) abi=arm64-v8a ;;
              esac
              "$apksigner" sign --ks "$ANDROID_KEYSTORE_PATH" \
                --ks-key-alias "$ANDROID_KEY_ALIAS" \
                --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
                --v4-signing-enabled false --out "../dist/$prefix-$architecture-Android.apk" \
                "build/app/outputs/flutter-apk/app-$abi-release.apk"
              "$apksigner" verify --verbose --print-certs "../dist/$prefix-$architecture-Android.apk"
            done
            ;;
          linux)
            flutter build linux --release "${args[@]}"
            if [[ "$PROGRAM" == pku_manager ]]; then
              curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
                https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
              echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum --check
              chmod +x "$RUNNER_TEMP/appimagetool"
              curl -fsSL -o "$RUNNER_TEMP/runtime-x86_64" \
                https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
              echo "1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf  $RUNNER_TEMP/runtime-x86_64" | sha256sum --check
              cmake -S packaging/linux -B build/appimage -G Ninja \
                -DAPPIMAGETOOL="$RUNNER_TEMP/appimagetool" -DRUNTIME="$RUNNER_TEMP/runtime-x86_64"
              cmake --build build/appimage --target appimage
              cp build/appimage/pku-manager.AppImage "../dist/$prefix-amd64-Linux.AppImage"
            else
              tar -C build/linux/x64/release/bundle -czf "../dist/$prefix-amd64-Linux.tar.gz" .
            fi
            ;;
          macos)
            # Flutter's release default is universal. Forward explicit Xcode
            # settings instead of attaching an arbitrary architecture label.
            flutter config --no-enable-macos-arm64-only
            for architecture in amd64 arm64; do
              case "$architecture" in
                amd64) native_arch=x86_64 ;;
                arm64) native_arch=arm64 ;;
              esac
              FLUTTER_XCODE_ARCHS="$native_arch" FLUTTER_XCODE_ONLY_ACTIVE_ARCH=NO \
                flutter build macos --release "${args[@]}"
              archive_apple_bundle "build/macos/Build/Products/Release/$PROGRAM.app" "$native_arch" "$architecture" macOS
            done
            ;;
          windows)
            flutter build windows --release "${args[@]}"
            if [[ "$PROGRAM" == pku_manager ]]; then
              choco install nsis --version=3.11 -y --no-progress
              MSYS_NO_PATHCONV=1 '/c/Program Files (x86)/NSIS/makensis.exe' "/DVERSION=$version" packaging/windows/installer.nsi
              cp packaging/windows/pku-manager-setup.exe "../dist/$prefix-amd64-Windows.exe"
            else
              7z a "../dist/$prefix-amd64-Windows.zip" ./build/windows/x64/runner/Release/*
            fi
            ;;
          ios)
            flutter build ios --release --no-codesign "${args[@]}"
            archive_apple_bundle build/ios/iphoneos/Runner.app arm64 arm64 iOS
            ;;
          ios-simulator)
            for architecture in amd64 arm64; do
              case "$architecture" in
                amd64) native_arch=x86_64 ;;
                arm64) native_arch=arm64 ;;
              esac
              FLUTTER_XCODE_ARCHS="$native_arch" FLUTTER_XCODE_ONLY_ACTIVE_ARCH=NO \
                flutter build ios --simulator "${args[@]}"
              archive_apple_bundle build/ios/iphonesimulator/Runner.app "$native_arch" "$architecture" iOS_Simulator
            done
            ;;
          *) echo "Unsupported platform: $PLATFORM" >&2; exit 1 ;;
        esac
    - name: bash - Remove Android Signing Key
      if: always() && inputs.platform == 'android'
      shell: bash
      run: rm -f "$RUNNER_TEMP/release.jks"
    - name: actions/upload-artifact@v7 - Upload Release Packages
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.repository }}-release-${{ inputs.platform }}
        path: dist/*
        if-no-files-found: error
        retention-days: 1