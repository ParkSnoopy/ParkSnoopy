name: Replace published release
description: Remove this program's previous releases and tags, then publish a new latest release.
inputs:
  repository:
    description: Source repository name and artifact prefix.
    required: true
  title:
    description: Human-readable repository title.
    required: true
  version:
    description: Three-component application version without a leading v.
    required: true
  token:
    description: Token with Contents and Workflows write access.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.repository }}-release-*
        path: release-assets
        merge-multiple: true
        github-token: ${{ env.GH_TOKEN }}
    - name: Replace with new latest release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_REPOSITORY: ${{ inputs.repository }}
        RELEASE_TITLE: ${{ inputs.title }}
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        title="$RELEASE_TITLE v$RELEASE_VERSION"
        shopt -s nullglob
        assets=(release-assets/*)
        (( ${#assets[@]} > 0 ))
        releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
        old_tags="$(jq -r --arg legacy "$RELEASE_REPOSITORY" --arg prefix "$RELEASE_TITLE v" \
          '.[] | (.name // "") as $name | select($name == $legacy or ($name | startswith($prefix) and (ltrimstr($prefix) | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))) | .tag_name' \
          <<< "$releases")"
        tag="$RELEASE_REPOSITORY-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        if [[ -n "$old_tags" ]]; then
          while IFS= read -r old_tag; do
            gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done <<< "$old_tags"
        fi
        tag_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        tag_sha="$(jq -n --arg tag "$tag" --arg title "$title" \
          --arg commit "$GITHUB_SHA" --arg date "$tag_date" \
          '{tag: $tag, message: $title, object: $commit, type: "commit", tagger: {name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com", date: $date}}' | \
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" --input - --jq .sha)"
        gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
          -f ref="refs/tags/$tag" -f sha="$tag_sha"
        gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" | \
          jq -e --arg sha "$tag_sha" '.object.type == "tag" and .object.sha == $sha'
        gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" | \
          jq -e --arg tag "$tag" --arg commit "$GITHUB_SHA" --arg date "$tag_date" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit and .tagger.date == $date'
        gh release create "$tag" "${assets[@]}" \
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --verify-tag \
          --title "$title" --notes '' --draft=false --latest
        gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
          --json name,isDraft,body,assets | \
          jq -e --arg name "$title" --argjson count "${#assets[@]}" \
            '.name == $name and (.isDraft == false) and ((.body // "") == "") and (.assets | length == $count)'
        remaining="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
        jq -e --arg legacy "$RELEASE_REPOSITORY" --arg prefix "$RELEASE_TITLE v" --arg tag "$tag" \
          '[.[] | (.name // "") as $name | select($name == $legacy or ($name | startswith($prefix) and (ltrimstr($prefix) | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))) | .tag_name] == [$tag]' \
          <<< "$remaining"